---
- name: Deploy Kolhapur Calorie Estimator
  hosts: local
  gather_facts: false
  vars:
    app_dir: "{{ lookup('env', 'HOME') }}/calorie-app"

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}/templates"
        state: directory
        mode: "0755"

    - name: Copy application files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - app.py
        - model.py
        - requirements.txt
        - templates/index.html

    - name: Install dependencies in a virtualenv
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Stop any previous instance
      ansible.builtin.shell: "[ -f app.pid ] && kill $(cat app.pid) || true"
      args:
        chdir: "{{ app_dir }}"
      changed_when: false

    - name: Start the app with gunicorn
      ansible.builtin.command: >
        {{ app_dir }}/venv/bin/gunicorn --daemon --pid app.pid
        --bind 0.0.0.0:5000 app:app
      args:
        chdir: "{{ app_dir }}"

    - name: Health check
      ansible.builtin.uri:
        url: http://localhost:5000/health
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200
